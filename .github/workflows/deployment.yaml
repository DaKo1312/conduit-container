name: Deployment

on:
  push:
    branches:
      - main
      - feature/conduit-deployment
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build the backend image
        run: docker build --tag conduit-backend:${{ github.sha }} ./backend
