name: conduit

services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: conduit
      POSTGRES_USER: conduit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conduit -d conduit"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    image: conduit-backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: conduit
      POSTGRES_USER: conduit
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"

  frontend:
    build: ./frontend
    image: conduit-frontend
    restart: unless-stopped
    environment:
      FRONTEND_PORT: 8080
      BACKEND_HOST: backend
      BACKEND_PORT: 8000
    depends_on:
      - backend
    ports:
      - "${FRONTEND_HOST_PORT:-8282}:8080"

volumes:
  postgres-data:
